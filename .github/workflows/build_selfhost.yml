name: Build & Publish web3.js

on:
  push:
    branches: [main, configure-github-action]
    tags: ['v*']
  pull_request:
    branches: [main, configure-github-action]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, linux, x64, zond]
    steps:
      - uses: actions/checkout@v4

      - name: System info
        run: |
          echo "Runner: $(hostname)"
          echo "Node: $(node --version)"
          echo "Yarn: $(yarn --version)"

      - name: Clone and prepare sibling dependencies
        run: |
          clone() {
            local dir="$1" repo="$2"
            if [ ! -d "$dir/.git" ]; then
              rm -rf "$dir"
              git clone --depth 1 "https://github.com/$repo.git" "$dir"
            fi
            cd "$dir" && npm install 2>/dev/null || yarn install --ignore-engines 2>/dev/null
            cd -
          }
          clone ../qrl-contracts        cyyber/qrl-contracts
          clone ../wallet.js            cyyber/wallet.js
          clone ../js-qrl-cryptography  cyyber/js-zond-cryptography
          clone ../qrypto.js            cyyber/qrypto.js

      - name: Install dependencies
        run: yarn install --ignore-engines --ignore-scripts

      - name: Build
        run: yarn run build --concurrency=2

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          git checkout -- yarn.lock
          npx lerna publish from-git --yes --no-verify-access
